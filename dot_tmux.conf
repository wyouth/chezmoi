# Cursor / VS Code integrated terminal uses xterm.js.
# Without mouse mode, the wheel becomes Up/Down and fish treats it as
# command history. With mouse on, wheel enters copy-mode and scrolls
# tmux scrollback instead.
set -g mouse on
set -g history-limit 50000

# Make wheel scrolling reliable inside Cursor's terminal.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"
